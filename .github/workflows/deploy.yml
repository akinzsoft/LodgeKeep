name: Deploy to production

# Real production bug, user-reported: a manual deploy scoped `docker compose
# ... up -d --build` to just the `backend` service, which silently skipped
# two things a full-stack rebuild would have covered — `migrate` (a
# one-shot service that only re-runs when the whole stack, or it by name,
# is brought up) and `frontend` (never rebuilt at all) — leaving the deploy
# half-applied with no error of any kind. This workflow exists to make that
# class of mistake structurally impossible: it always runs the exact,
# full, documented command from docker-compose.prod.yml's own header
# comment, with no service-name restriction, and then actually verifies
# the result rather than trusting exit codes alone.
#
# Deliberately a SEPARATE file from ci.yml, not a third job inside it —
# ci.yml has been test+lint-only since Phase 0, and gating deploy on it via
# `workflow_run` (below) needs no change to that file at all.
#
# ── Required GitHub Secrets (Settings → Secrets and variables → Actions) ──
#   VPS_HOST          SSH host/IP of the production VPS.
#   VPS_USERNAME       SSH username.
#   VPS_SSH_KEY        Private half of a deploy keypair whose public half is
#                      in that user's ~/.ssh/authorized_keys on the VPS.
#                      Generate a KEY DEDICATED TO THIS — never reuse a
#                      personal key. `ssh-keygen -t ed25519 -C
#                      "lodgekeep-deploy" -f deploy_key -N ""`, add
#                      deploy_key.pub to authorized_keys on the VPS, put the
#                      contents of deploy_key (the PRIVATE half) in this
#                      secret, then delete both local files.
#   VPS_PORT           SSH port. Optional — defaults to 22 if unset.
#   VPS_DEPLOY_PATH    Absolute path on the VPS to the existing LodgeKeep
#                      checkout (the directory containing
#                      docker-compose.prod.yml and .env.production).
#
# None of these are application secrets — .env.production itself is never
# read, templated, or transmitted by this workflow. It already lives on
# the VPS (gitignored, confirmed via `git check-ignore -v`) and stays
# there; the deploy command's own `--env-file .env.production` flag reads
# it from disk on the server, exactly as a human running the command by
# hand already does.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  # Manual redeploy of main through this same verified pipeline (Actions →
  # Deploy to production → Run workflow). Exists so that "deploy by hand on
  # the VPS" is never the only way to ship: an ad-hoc SSH deploy skips the
  # branch/commit guard and the health verification below.
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    # Pinned, not `ubuntu-latest`: GitHub moves that label to Ubuntu 26 on
    # 2026-10-19 and this job runs a Docker-based action (ssh-action); a
    # silent runner change is exactly the kind of surprise a deploy must not get.
    runs-on: ubuntu-24.04
    # workflow_run fires for every branch CI runs on — the real gate is
    # here, not in the trigger's own (unreliable for this event type)
    # `branches:` filter: only deploy a CI run that (a) was for `main` and
    # (b) actually passed. A red build on main must never reach this job.
    # A manual dispatch is allowed only from main itself.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    # Serializes deploys rather than letting two overlapping runs interleave
    # `docker compose up --build` calls on the same box — queues, never
    # cancels a deploy that's already in flight partway through a rebuild.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy and verify
        # Pinned by commit SHA, not a floating version tag — this repo's
        # own established discipline for every third-party image
        # (docker-compose.prod.yml's mysql/redis/caddy are all digest-
        # pinned). Dependabot's existing `github-actions` ecosystem entry
        # (.github/dependabot.yml, directory "/") already covers
        # .github/workflows/*, so a version bump here arrives as an
        # ordinary PR, gated on CI, like any other dependency bump.
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          command_timeout: 15m
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_DEPLOY_PATH }}"
            # One definition, every call site below — the exact,
            # documented invocation (docker-compose.prod.yml's own header:
            # --env-file is required, its name isn't Compose's default;
            # -f is required, this directory also has a dev
            # docker-compose.yml). $COMPOSE is deliberately unquoted at
            # every call site so it expands as separate words, not one
            # (shellcheck SC2086 — checked, this is the intended case).
            COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml"

            # The commit CI just verified (a manual dispatch uses main's tip).
            EXPECTED_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"

            echo "::group::git pull"
            # A plain `git pull --ff-only` pulls whatever branch the VPS
            # checkout happens to be on. If someone left it on a feature
            # branch (e.g. to try a PR), that pull is a silent no-op, the
            # build is a cache hit, every health check passes, and the run
            # goes GREEN without shipping main. So: require main, pull main
            # explicitly, and prove the CI-verified commit is what we built.
            branch="$(git branch --show-current)"
            if [ "$branch" != "main" ]; then
              echo "::error::The VPS checkout is on '${branch:-detached HEAD}', not main, so this deploy cannot ship main. Fix on the VPS: git checkout main"
              exit 1
            fi
            # --ff-only: if the VPS checkout has local/manual drift this fails
            # loudly rather than discarding it or creating a merge commit.
            git pull --ff-only origin main
            if ! git merge-base --is-ancestor "$EXPECTED_SHA" HEAD; then
              echo "::error::VPS HEAD ($(git rev-parse --short HEAD)) does not contain the commit that passed CI (${EXPECTED_SHA:0:7})."
              exit 1
            fi
            echo "Deploying: $(git log -1 --format='%h %s')"
            echo "::endgroup::"

            echo "::group::docker compose up --build (full stack — migrate and frontend included, never scoped to one service)"
            # `migrate` is a one-shot container that exits and stays around.
            # Remove last deploy's copy first so this deploy always creates
            # a fresh one from the image built below, instead of relying on
            # Compose deciding the old, already-exited container is
            # up to date (it then never runs, and its log still shows the
            # PREVIOUS deploy's "Already up to date").
            $COMPOSE rm -f migrate
            $COMPOSE up -d --build
            echo "::endgroup::"

            echo "::group::Verify migrate actually completed"
            MIGRATE_EXIT="$(docker inspect --format='{{.State.ExitCode}}' lodgekeep-prod-migrate-1)"
            $COMPOSE logs migrate --tail=30
            if [ "$MIGRATE_EXIT" != "0" ]; then
              echo "migrate exited with code $MIGRATE_EXIT"
              exit 1
            fi
            # Exit code and log text both pass when migrate ran an image
            # without the new migration files, or never ran this deploy
            # (a prior deploy shipped code without its schema this way).
            # So compare the database with THIS checkout: run the
            # idempotent migrate once more (a no-op when the container
            # above already did the work), then require the newest
            # migration file in git to be recorded as completed and
            # nothing to be pending.
            $COMPOSE run --rm --no-deps -T migrate npx knex migrate:latest
            LATEST_MIGRATION="$(ls backend/migrations | sort | tail -n 1)"
            MIGRATION_LIST="$($COMPOSE run --rm --no-deps -T migrate npx knex migrate:list 2>&1)"
            if ! printf '%s\n' "$MIGRATION_LIST" | grep -qxF "$LATEST_MIGRATION"; then
              echo "::error::The newest migration in this checkout ($LATEST_MIGRATION) is not recorded as completed in the production database."
              printf '%s\n' "$MIGRATION_LIST" | tail -n 15
              exit 1
            fi
            if printf '%s\n' "$MIGRATION_LIST" | grep -q "Pending Migration"; then
              echo "::error::Migrations are still pending after migrate ran."
              printf '%s\n' "$MIGRATION_LIST" | tail -n 15
              exit 1
            fi
            echo "Schema is at $LATEST_MIGRATION, nothing pending."
            echo "::endgroup::"

            echo "::group::Wait for backend to report Docker-healthy"
            # backend publishes no host port at all (the real security
            # boundary for /internal/ask-tls) — Docker's own recorded
            # health status, driven by the Dockerfile's HEALTHCHECK
            # against GET /healthz (a real `SELECT 1` against MySQL, not
            # just "the process is listening"), is what's actually
            # checkable from here. start_period=30s/interval=15s in that
            # HEALTHCHECK means "healthy" can take up to ~45s to appear
            # after a fresh container start — this polls rather than
            # checking once.
            healthy=""
            for attempt in $(seq 1 24); do
              status="$(docker inspect -f '{{.State.Health.Status}}' lodgekeep-prod-backend-1 2>/dev/null || echo missing)"
              echo "backend health: $status (attempt $attempt/24)"
              if [ "$status" = "healthy" ]; then
                healthy=1
                break
              fi
              sleep 5
            done
            if [ -z "$healthy" ]; then
              echo "backend did not report healthy within 120s"
              $COMPOSE logs backend --tail=100
              exit 1
            fi
            echo "::endgroup::"

            echo "::group::Confirm GET /healthz directly, inside the Docker network"
            # Belt-and-braces beyond Docker's own recorded status: proves
            # the exact request/response path a real caller (Caddy's own
            # upstream health probe) depends on, not merely that the
            # container process is alive.
            $COMPOSE exec -T backend \
              node -e "require('http').get('http://127.0.0.1:3000/healthz', r => { let b=''; r.on('data', d => b += d); r.on('end', () => { console.log(r.statusCode, b); process.exit(r.statusCode === 200 ? 0 : 1); }); }).on('error', e => { console.error(e); process.exit(1); })"
            echo "::endgroup::"

            echo "::group::Confirm frontend/Caddy is serving"
            # frontend has no Docker healthcheck of its own (nothing
            # depends on one), and a genuine end-to-end HTTPS check through
            # Caddy's real reverse proxy needs a real tenant hostname with
            # DNS already pointed here — out of scope for a same-box,
            # DNS-free check. Caddy's bare :80 block matches ANY Host
            # header and unconditionally redirects to https, so this is a
            # real, meaningful proof that Caddy itself started and its
            # (version-sensitive — see the Caddyfile's own header) config
            # loaded without a validation error, without needing DNS.
            http_status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1/)"
            echo "Caddy :80 responded with $http_status"
            if [ "$http_status" != "301" ] && [ "$http_status" != "308" ]; then
              echo "Expected a redirect (301/308) from Caddy's :80 block, got $http_status"
              $COMPOSE logs frontend --tail=100
              exit 1
            fi
            echo "::endgroup::"

            echo "Deploy verified at $(git rev-parse --short HEAD): migrate ran clean, backend is healthy, frontend is serving."
