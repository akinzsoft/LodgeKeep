name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (test + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real MySQL instance, not mocked: TESTING.md's suite exercises unique
    # constraints, FK enforcement, transaction rollback, and row locking on the
    # last-room race, which a mock cannot stand in for (same reason local dev
    # runs MySQL via docker-compose rather than an in-memory substitute).
    #
    # Redis is here for the same reason, as of tests/jobs/outbox-dispatcher.test.js
    # (the first live-BullMQ integration test in this codebase, ARCHITECTURE.md
    # §14) — it needs a real Queue backed by a real Redis to prove a job
    # scheduler is genuinely registered, which a mock cannot stand in for
    # either. `redis-connection.js`'s own default (127.0.0.1:6379) needs no
    # extra env vars here, matching this service's exposed port exactly.
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: lodgekeep_dev
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: lodgekeep_dev
      # Must contain "test" — knexfile.js and tests/helpers/global-setup.js
      # both refuse to run otherwise (TESTING.md Part 1).
      DB_NAME_TEST: lodgekeep_test
      NODE_ENV: test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      APP_DOMAIN: lodgekeep.app
      # src/shared/encryption.js — a throwaway key for the CI schema only,
      # never a real secret. Required to encrypt/decrypt email_settings'
      # smtp_password_encrypted column.
      ENCRYPTION_KEY: QHPmf9o+5XHE98VJUL6OTl/xicwtWLhDrZsSOOnhtIo=

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create test database
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS lodgekeep_test CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;"

      # Explicit step so a broken migration fails here with its own clear
      # error, ahead of (and separate from) the same rebuild Jest's own
      # globalSetup (tests/helpers/global-setup.js) performs before the suite.
      - name: Run migrations against the test database
        run: npx knex migrate:latest --env test

      # CI-only unblock, not a fix: `npm test` (jest --runInBand) never
      # explicitly closes its Redis connections (the BullMQ singleton,
      # and — new on this branch — the QR-ordering rate-limiter's own),
      # so once anything opens one, the process has a live, un-.unref()'d
      # socket and never exits on its own once tests finish. Locally this
      # only ever showed up as Jest's own "did not exit" warning, because
      # this environment's own memory pressure reliably kills the lingering
      # process within a minute or two; a normal CI runner has no such
      # watchdog, so the step just hangs until the job's own default
      # timeout. `--forceExit` here only makes CI actually terminate a
      # suite that has already passed — it does not close either
      # connection cleanly. See CLAUDE.md's own "test suite never
      # explicitly closes its Redis connections" note for the real fix,
      # deliberately kept as its own separate, later pass.
      - name: Test
        run: npx jest --runInBand --forceExit

      - name: Lint
        run: npm run lint

  frontend:
    name: Frontend (test + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # jsdom 30's own package.json requires Node ^22.22.2 || ^24.15.0 || >=26.0.0
      # (see node_modules/jsdom/package.json) — Node 20 fails at test time with
      # "webidl.util.markAsUncloneable is not a function". Backend has no such
      # dependency and stays on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint
